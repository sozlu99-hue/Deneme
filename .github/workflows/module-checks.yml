name: Server module checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-sync-test-only
          POSTGRES_DB: aesd_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgres://postgres:isolated-sync-test-only@127.0.0.1:55432/aesd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs tests/oses-recovery.mjs tests/gmail-provider.mjs
      - name: Legacy mail with isolated durable storage
        run: DATABASE_URL="$TEST_PG_URL" node tests/email-auth.mjs
      - run: npm install --prefix platform --no-package-lock
      - run: npm --prefix platform test
      - run: npm --prefix platform run test:private
      - run: npm --prefix platform run test:native
      - name: Shared PostgreSQL finance
        working-directory: platform
        run: node --experimental-vm-modules --test --test-isolation=none tests/cloud-postgres.mjs
      - name: Recipe PostgreSQL concurrency and receipt recovery
        working-directory: platform
        run: node --experimental-vm-modules --test --test-isolation=none tests/recipe-postgres.mjs
      - name: Stock workspace PostgreSQL concurrency and receipt recovery
        working-directory: platform
        run: node --experimental-vm-modules --test --test-isolation=none tests/stock-workspace-postgres.mjs
      - name: Ready goods PostgreSQL last-piece concurrency and receipt recovery
        working-directory: platform
        run: node --experimental-vm-modules --test --test-isolation=none tests/simple-stock-postgres.mjs
      - name: Private shop manager PostgreSQL access and receipt isolation
        working-directory: platform
        run: node --experimental-vm-modules --test --test-isolation=none tests/shop-manager-postgres.mjs

      - name: Business reset PostgreSQL transaction and stale-write barriers
        working-directory: platform
        run: node --experimental-vm-modules --test --test-isolation=none tests/business-reset-postgres.mjs

      - name: Simple contents PostgreSQL selection, cancellation and receipt isolation
        working-directory: platform
        run: node --experimental-vm-modules --test --test-isolation=none tests/simple-ingredients-postgres.mjs
