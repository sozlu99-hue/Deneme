name: AESD Persistence Audit

on:
  workflow_dispatch:
  push:
    branches: [aesd-persistence-audit]
    paths:
      - persistence.js
      - server.js
      - index.js
      - package.json
      - package-lock.json
      - .github/workflows/persistence-audit.yml

permissions:
  contents: read

jobs:
  persistence-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aesd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aesd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aesd-persistence-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check server.js
          node --check index.js
          node --check persistence.js

      - name: Verify SQLite snapshot serialization
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          import fs from 'node:fs';
          const file = 'snapshot-test.db';
          const db = new Database(file);
          db.exec("CREATE TABLE t(id INTEGER PRIMARY KEY, value TEXT); INSERT INTO t(value) VALUES ('ok');");
          const data = db.serialize();
          db.close();
          if (!Buffer.isBuffer(data) || data.length < 100) process.exit(1);
          fs.unlinkSync(file);
          console.log('SQLite serialize OK:', data.length);
          NODE

      - name: Verify Postgres snapshot round trip
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aesd_test
          PERSISTENCE_REQUIRED: '1'
          DB_PATH: durable-test.db
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          import fs from 'node:fs';
          const file = process.env.DB_PATH;
          const db = new Database(file);
          db.exec("CREATE TABLE durable(id INTEGER PRIMARY KEY, value TEXT); INSERT INTO durable(value) VALUES ('first');");
          db.close();

          const persistence = await import('./persistence.js');
          await persistence.restorePersistentSnapshot();
          await persistence.initializePersistentSnapshot();

          fs.rmSync(file, {force: true});
          fs.rmSync(`${file}-wal`, {force: true});
          fs.rmSync(`${file}-shm`, {force: true});
          await persistence.restorePersistentSnapshot();
          let restored = new Database(file);
          if (restored.prepare('SELECT value FROM durable WHERE id=1').get()?.value !== 'first') process.exit(2);
          restored.prepare("UPDATE durable SET value='second' WHERE id=1").run();
          restored.close();
          await persistence.persistDatabaseSnapshot();

          fs.rmSync(file, {force: true});
          fs.rmSync(`${file}-wal`, {force: true});
          fs.rmSync(`${file}-shm`, {force: true});
          await persistence.restorePersistentSnapshot();
          restored = new Database(file);
          if (restored.prepare('SELECT value FROM durable WHERE id=1').get()?.value !== 'second') process.exit(3);
          restored.close();

          const status = persistence.getPersistenceStatus();
          if (!status.snapshotExists || status.mode !== 'external-postgres-snapshot' || !status.lastRestoredAt) process.exit(4);
          await persistence.closePersistence();
          fs.rmSync(file, {force: true});
          console.log('Durable Postgres snapshot round trip OK');
          NODE
