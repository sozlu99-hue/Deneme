name: Validate AESD Server

on:
  push:
    branches: [main, security-finalize]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check index.js
          node --check server-patch.js
          node --check google-oauth-patch.js
          node --check password-channel-patch.js
          node --check server.js
      - name: API security and licensing smoke tests
        env:
          JWT_SECRET: ci-test-secret-only-change-me
          OWNER_EMAIL: owner-ci@aesd.local
          OWNER_PASSWORD: OwnerTest123!
          PORT: '8787'
          DB_PATH: /tmp/aesd-ci.db
        run: |
          rm -f /tmp/aesd-ci.db /tmp/aesd-ci.db-shm /tmp/aesd-ci.db-wal
          npm start > /tmp/aesd-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat /tmp/aesd-server.log' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json

          OWNER_JSON=$(curl --fail --silent -X POST http://127.0.0.1:8787/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner-ci@aesd.local","password":"OwnerTest123!","deviceKey":"ci-owner-device","buildVariant":"owner"}')
          OWNER_TOKEN=$(printf '%s' "$OWNER_JSON" | jq -r '.token')
          test -n "$OWNER_TOKEN" && test "$OWNER_TOKEN" != "null"

          USER_JSON=$(curl --fail --silent -X POST http://127.0.0.1:8787/admin/users \
            -H "Authorization: Bearer $OWNER_TOKEN" -H 'Content-Type: application/json' \
            -d '{"email":"client-ci@aesd.local","password":"ClientTest123!","days":30}')
          test "$(printf '%s' "$USER_JSON" | jq -r '.email')" = 'client-ci@aesd.local'

          CLIENT_JSON=$(curl --fail --silent -X POST http://127.0.0.1:8787/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"client-ci@aesd.local","password":"ClientTest123!","deviceKey":"ci-client-account","buildVariant":"client"}')
          CLIENT_TOKEN=$(printf '%s' "$CLIENT_JSON" | jq -r '.token')
          test -n "$CLIENT_TOKEN" && test "$CLIENT_TOKEN" != "null"

          STATUS=$(curl --silent -o /tmp/owner-denied.json -w '%{http_code}' -X POST http://127.0.0.1:8787/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"client-ci@aesd.local","password":"ClientTest123!","deviceKey":"ci-client-account","buildVariant":"owner"}')
          test "$STATUS" = '403'

          PHONE_JSON=$(curl --fail --silent -X POST http://127.0.0.1:8787/admin/phone-licenses \
            -H "Authorization: Bearer $OWNER_TOKEN" -H 'Content-Type: application/json' \
            -d '{"label":"CI phone","phone":"05551234567","days":30}')
          PHONE_ID=$(printf '%s' "$PHONE_JSON" | jq -r '.id')
          test -n "$PHONE_ID" && test "$PHONE_ID" != "null"
          test "$(printf '%s' "$PHONE_JSON" | jq -r '.sms.status')" = 'failed'

          PHONE_LIST=$(curl --fail --silent http://127.0.0.1:8787/admin/phone-licenses \
            -H "Authorization: Bearer $OWNER_TOKEN")
          test "$(printf '%s' "$PHONE_LIST" | jq -r '.licenses | length')" = '1'

          curl --fail --silent -X DELETE "http://127.0.0.1:8787/admin/phone-licenses/$PHONE_ID" \
            -H "Authorization: Bearer $OWNER_TOKEN" >/tmp/phone-delete.json
          test "$(jq -r '.ok' /tmp/phone-delete.json)" = 'true'

          LICENSE_JSON=$(curl --fail --silent -X POST http://127.0.0.1:8787/admin/licenses \
            -H "Authorization: Bearer $OWNER_TOKEN" -H 'Content-Type: application/json' \
            -d '{"label":"CI activation","days":30}')
          LICENSE_ID=$(printf '%s' "$LICENSE_JSON" | jq -r '.id')
          CODE=$(printf '%s' "$LICENSE_JSON" | jq -r '.code')
          test -n "$CODE" && test "$CODE" != "null"

          ACT_JSON=$(curl --fail --silent -X POST http://127.0.0.1:8787/v1/licenses/activate \
            -H 'Content-Type: application/json' \
            -d "{\"code\":\"$CODE\",\"deviceId\":\"ci-activation-device\"}")
          ACT_TOKEN=$(printf '%s' "$ACT_JSON" | jq -r '.token')
          test "$(printf '%s' "$ACT_JSON" | jq -r '.active')" = 'true'

          VALIDATE_JSON=$(curl --fail --silent -X POST http://127.0.0.1:8787/v1/licenses/validate \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$ACT_TOKEN\",\"deviceId\":\"ci-activation-device\"}")
          test "$(printf '%s' "$VALIDATE_JSON" | jq -r '.active')" = 'true'

          STATUS=$(curl --silent -o /tmp/device-denied.json -w '%{http_code}' -X POST http://127.0.0.1:8787/v1/licenses/validate \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$ACT_TOKEN\",\"deviceId\":\"wrong-device\"}")
          test "$STATUS" = '403'

          curl --fail --silent -X DELETE "http://127.0.0.1:8787/admin/licenses/$LICENSE_ID" \
            -H "Authorization: Bearer $OWNER_TOKEN" >/tmp/license-delete.json
          test "$(jq -r '.ok' /tmp/license-delete.json)" = 'true'

          echo 'AESD API smoke tests passed.'
