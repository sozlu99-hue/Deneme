name: AESD interface and packaging checks
on:
  push:
    branches: [main, 'review/aesd-interface-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
      - run: npm ci
      - run: npm ci --prefix platform
      - name: Install Chromium and WebKit
        working-directory: platform
        run: npx playwright install --with-deps chromium webkit
      - name: Source and packaging checks
        run: |
          python -m pip install Pillow==12.0.0
          python platform/tests/apk-packaging-check.py
          python platform/build-apks.py --check-sources
      - name: All actual browser scenarios
        working-directory: platform
        env:
          AESD_OWNER_EVIDENCE: ${{ runner.temp }}/aesd-owner-browser
        run: npm run test:browser
      - name: Private shop readiness, safe reset and stock contents in WebKit
        working-directory: platform
        env:
          AESD_BROWSER_ENGINE: webkit
        run: node tests/run-browser.mjs tests/shop-manager-readiness-browser.mjs tests/simple-reset-browser.mjs tests/simple-ingredients-browser.mjs
      # Synthetic pass names only. Do not publish browser storage, screenshots,
      # server logs, authentication responses or raw financial fixtures.
      - name: Build safe summaries
        if: always()
        run: node .github/scripts/interface-summary.mjs "${{ runner.temp }}/aesd-interface-summary"
      - name: Safe browser result summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aesd-browser-result-summaries
          path: ${{ runner.temp }}/aesd-interface-summary/*.json
          if-no-files-found: ignore
          retention-days: 7
